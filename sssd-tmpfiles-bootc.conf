# tmpfiles.d configuration for SSSD bootc/rpm-ostree compatibility
# Ensures correct file ownership after sysusers creates the sssd user/group
#
# In bootc/rpm-ostree images, file ownership embedded in OCI layers may not
# resolve correctly because the sssd group doesn't exist at image build time.
# These entries fix ownership at boot after systemd-sysusers runs.

# Executables that must be executable by sssd user (mode 0750 root:sssd)
z /usr/libexec/sssd/krb5_child 0750 root sssd - -
z /usr/libexec/sssd/ldap_child 0750 root sssd - -
z /usr/libexec/sssd/sssd_pam 0750 root sssd - -
z /usr/libexec/sssd/proxy_child 0750 root sssd - -
z /usr/libexec/sssd/selinux_child 0750 root sssd - -

# Configuration directories (mode 0750 root:sssd)
z /etc/sssd 0750 root sssd - -
z /etc/sssd/conf.d 0750 root sssd - -
z /etc/sssd/pki 0750 root sssd - -

# State directories owned by sssd:sssd
z /var/lib/sss 0775 sssd sssd - -
z /var/lib/sss/db 0770 sssd sssd - -
z /var/lib/sss/mc 0775 sssd sssd - -
z /var/lib/sss/secrets 0770 sssd sssd - -
z /var/lib/sss/deskprofile 0771 sssd sssd - -
z /var/lib/sss/pipes 0775 sssd sssd - -
z /var/lib/sss/pipes/private 0770 sssd sssd - -
z /var/lib/sss/pubconf 0775 sssd sssd - -
z /var/lib/sss/pubconf/krb5.include.d 0775 sssd sssd - -
z /var/lib/sss/gpo_cache 0770 sssd sssd - -
z /var/lib/sss/keytabs 0770 sssd sssd - -

# Log directory
z /var/log/sssd 0770 sssd sssd - -

# Runtime directory
z /run/sssd 0775 sssd sssd - -
